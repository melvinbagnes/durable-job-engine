services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jobengine
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobengine"]
      interval: 3s
      timeout: 3s
      retries: 20

  demo:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=db;Username=postgres;Password=postgres;Database=jobengine
    ports:
      - "8080:8080"
