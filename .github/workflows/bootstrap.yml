name: bootstrap
on:
  push:
    paths: ["project.tgz"]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit
        run: |
          tar -xzf project.tgz
          rm project.tgz
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -m "Add project files"
          git push
