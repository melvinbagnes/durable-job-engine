name: bootstrap
on:
  push:
    paths: ["project.tgz"]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack
        run: |
          tar -xzf project.tgz
          rm project.tgz
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add LISTEN/NOTIFY wake-up, database clock, cron time zones, benchmark and smoke test"
          git push
